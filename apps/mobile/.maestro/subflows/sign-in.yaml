# Sign in with email and password through Supabase Auth (US-01, ENG-22, ENG-24). TEST_EMAIL and TEST_PASSWORD
# belong to a citizen account on the Supabase project the build points at (create it once in the app's sign-up).
appId: ${APP_ID}
---
- tapOn:
    id: "signin-identifier"
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "signin-password"
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: "signin-submit"
