# Sign in with an email one-time code (US-01). Staging accepts the fixed test code below for the test address only.
appId: ${APP_ID}
---
- tapOn:
    id: "signin-identifier"
- inputText: ${TEST_EMAIL}
- tapOn: "Send me a code"
- tapOn:
    id: "signin-code"
- inputText: ${TEST_CODE}
- tapOn:
    id: "signin-confirm"
