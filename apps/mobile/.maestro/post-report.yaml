# Maestro flow: camera and post path (engineering plan, "Tests"). Runs on a simulator or emulator with a dev build.
# The UI follows the device language (German, or English on an English device), so text checks accept both.
appId: ${APP_ID}
name: Post a report inside Neukölln
# Phase 3: a signed-in citizen may see the category pre-selected from the photo (US-14); the flow taps the
# category anyway, which also covers changing it. After posting, "Already reported?" (US-13) appears only when
# similar reports are nearby; the flow then answers "No, mine is new".
tags:
  - wip
  - US-06
  - US-11
  - US-13
  - US-14
  - US-41
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# Karl-Marx-Straße 100, Neukölln (pilot tenant)
- setLocation:
    latitude: 52.4795
    longitude: 13.4365
- tapOn:
    id: "nav-new-report"
- assertVisible:
    id: "camera-viewfinder"
- tapOn:
    id: "camera-shutter"
- assertVisible: "(Geht an|Goes to) Bezirksamt Neukölln"
- tapOn:
    id: "category-traffic_light"
- tapOn:
    id: "report-description"
- inputText: "Pedestrian light dark since this morning"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "report-post"
- tapOn:
    id: "report-post"
- runFlow:
    when:
      visible:
        id: "signin-sheet"
    file: subflows/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: "posted-title|dup-screen"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "dup-screen"
    commands:
      - assertVisible: "(Schon gemeldet\\?|Already reported\\?)"
      - scrollUntilVisible:
          element:
            id: "dup-new"
      - tapOn:
          id: "dup-new"
- assertVisible:
    id: "posted-title"
- assertVisible:
    id: "posted-id"
    text: "#BE-NK-2026-\\d{4}"
