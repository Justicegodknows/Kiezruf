# Maestro flow: reporting where Kiezruf is not live (US-44).
appId: ${APP_ID}
name: Camera in a not-live tenant
tags:
  - wip
  - US-44
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# Oranienplatz, Friedrichshain-Kreuzberg (not live)
- setLocation:
    latitude: 52.5023
    longitude: 13.4185
- tapOn:
    id: "nav-new-report"
- tapOn:
    id: "camera-shutter"
- assertVisible:
    id: "notlive-heading"
    text: "(Kiezruf ist in Friedrichshain-Kreuzberg noch nicht live|Kiezruf isn't live in Friedrichshain-Kreuzberg yet)"
- tapOn:
    id: "notlive-notify"
- runFlow:
    when:
      visible:
        id: "signin-sheet"
    file: subflows/sign-in.yaml
- assertVisible: ".*(Wir sagen dir Bescheid|We will tell you)"
