<title>Kiezruf MVP Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: street-sign clarity, carried over from the Neukölln v0.1 prototype. One signal-yellow action per screen.
   Shell = sticky tab bar (Plan · Stories · App · Web · Admin). Prototype views = screen index | stage | stories on this screen. */
:root{
  --bg:#e9eeeb; --surface:#ffffff; --sunk:#f3f6f4; --ink:#14212c; --muted:#56646f; --line:#d3dbd7;
  --signal:#f4c430; --signal-ink:#14212c; --tram:#0d6b5b; --tram-soft:#dcefea;
  --crit:#c4382e; --crit-soft:#f9e1de; --high:#b45f06; --high-soft:#fbead6; --med:#2f6fa8; --med-soft:#dfeaf5; --low:#6a7782; --low-soft:#e8ecef; --ok:#2c7a4b; --ok-soft:#dcf0e3;
  --scene-sky:#cfe0e8; --scene-ground:#9aa8b0; --scene-obj:#3b4954; --scene-hi:#f4c430;
  --map-bg:#dde6e1; --map-road:#ffffff; --map-park:#c4dcc8; --map-water:#bcd6e6;
  --shadow:0 1px 2px rgba(20,33,44,.06),0 8px 28px rgba(20,33,44,.10);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1217; --surface:#151e26; --sunk:#111920; --ink:#e7edf0; --muted:#9aa8b2; --line:#26333d;
    --signal:#f4c430; --signal-ink:#14212c; --tram:#53c4ad; --tram-soft:#173a34;
    --crit:#f07a6f; --crit-soft:#3d1d1a; --high:#eaa456; --high-soft:#3a2a14; --med:#7fb3e6; --med-soft:#172b3e; --low:#a2aeb8; --low-soft:#222c34; --ok:#6fcb93; --ok-soft:#173226;
    --scene-sky:#243845; --scene-ground:#3a4852; --scene-obj:#c9d3d9; --scene-hi:#f4c430;
    --map-bg:#18232b; --map-road:#2c3a45; --map-park:#1f3a2c; --map-water:#1b3446;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1217; --surface:#151e26; --sunk:#111920; --ink:#e7edf0; --muted:#9aa8b2; --line:#26333d;
  --signal:#f4c430; --signal-ink:#14212c; --tram:#53c4ad; --tram-soft:#173a34;
  --crit:#f07a6f; --crit-soft:#3d1d1a; --high:#eaa456; --high-soft:#3a2a14; --med:#7fb3e6; --med-soft:#172b3e; --low:#a2aeb8; --low-soft:#222c34; --ok:#6fcb93; --ok-soft:#173226;
  --scene-sky:#243845; --scene-ground:#3a4852; --scene-obj:#c9d3d9; --scene-hi:#f4c430;
  --map-bg:#18232b; --map-road:#2c3a45; --map-park:#1f3a2c; --map-water:#1b3446;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tram);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column}
.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}

/* ---------- shell ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--signal);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;left:6px;top:4px;width:10px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--signal-ink)}
.brand small{font:500 .72rem var(--f-mono);color:var(--muted);background:var(--sunk);border:1px solid var(--line);padding:1px 6px;border-radius:99px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:99px;font-weight:700;font-size:.9rem}
.tabs a:hover{color:var(--ink);background:var(--sunk)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.page{max-width:1320px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- plan document ---------- */
.doc{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:2px;font-size:.9rem}
.toc a{color:var(--muted);text-decoration:none;padding:4px 10px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--ink);border-left-color:var(--tram)}
.doc-main{display:flex;flex-direction:column;gap:44px;min-width:0}
.doc-main section{display:flex;flex-direction:column;gap:14px;scroll-margin-top:90px}
.doc-main h1{font-size:clamp(1.8rem,4vw,2.6rem)}
.doc-main h2{font-size:1.45rem}
.doc-main h3{font-size:1.05rem}
.lede{font-size:1.12rem;max-width:68ch}
.prose{max-width:72ch;display:flex;flex-direction:column;gap:10px}
.eyebrow{font:500 .75rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--tram)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.fact b{font-family:var(--f-display);font-size:1.05rem}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td .mono{white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 .7rem var(--f-mono);letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.c-kept{background:var(--low-soft);color:var(--low)}
.c-changed{background:var(--high-soft);color:var(--high)}
.c-new{background:var(--tram-soft);color:var(--tram)}
.c-later{background:var(--sunk);color:var(--muted);border-color:var(--line)}
.c-live{background:var(--ok-soft);color:var(--ok)}
.c-pilot{background:var(--med-soft);color:var(--med)}
.c-notlive{background:var(--sunk);color:var(--muted);border-color:var(--line)}
.c-group{background:transparent;color:var(--muted);border-color:var(--line)}
.lv{font:700 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:6px;white-space:nowrap}
.lv-Critical{background:var(--crit-soft);color:var(--crit)}
.lv-High{background:var(--high-soft);color:var(--high)}
.lv-Medium{background:var(--med-soft);color:var(--med)}
.lv-Low{background:var(--low-soft);color:var(--low)}

.tree{list-style:none;margin:0;padding:0;font-size:.92rem}
.tree ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--line);margin-left:9px}
.tree li{padding:3px 0}
.tnode{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:4px 8px;border-radius:8px;border:1px solid transparent;background:none;text-align:left}
button.tnode:hover{background:var(--sunk)}
button.tnode[aria-pressed="true"]{border-color:var(--tram);background:var(--tram-soft)}
.tnode b{font-weight:700}
.tnode .ty{font:500 .72rem var(--f-mono);color:var(--muted)}
.callout{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;max-width:80ch}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.card-s{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card-s h3{font-size:1rem}
.card-s ul,.prose ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.gantt{display:grid;grid-template-columns:minmax(150px,220px) minmax(520px,1fr);font-size:.85rem;min-width:700px}
.gantt>div{padding:8px 10px;border-bottom:1px solid var(--line)}
.gantt .gh{font:500 .7rem var(--f-mono);color:var(--muted);background:var(--sunk);display:grid;grid-template-columns:repeat(26,1fr)}
.gantt .gh span{text-align:left}
.gantt .bar-row{position:relative;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/26 - 1px),var(--line) calc(100%/26 - 1px),var(--line) calc(100%/26))}
.gantt .bar{position:absolute;top:8px;bottom:8px;border-radius:6px;background:var(--tram);color:var(--surface);font:500 .7rem var(--f-mono);display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden}
.gantt .bar.pilot{background:var(--signal);color:var(--signal-ink)}

/* ---------- prototype layout ---------- */
.proto{display:grid;grid-template-columns:210px minmax(0,1fr) 270px;gap:20px;align-items:start}
.scr-index{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.scr-index h3{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 4px}
.scr-index button{background:none;border:0;text-align:left;padding:6px 10px;border-radius:8px;color:var(--muted);font-size:.9rem}
.scr-index button:hover{background:var(--surface);color:var(--ink)}
.scr-index button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--tram)}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.notes h3{font-size:1rem}
.notes .st{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.notes .st:first-of-type{border-top:0}
.notes .chg{background:var(--high-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.85rem}
.sim{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.sim label{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sim select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--sunk)}
.stage{display:flex;justify-content:center;min-width:0}

/* phone */
.phone{width:360px;max-width:100%;height:720px;background:var(--surface);border:10px solid var(--ink);border-radius:42px;box-shadow:var(--shadow);overflow:hidden;position:relative;display:flex;flex-direction:column}
.sbar{display:flex;justify-content:space-between;padding:8px 22px 4px;font:500 .72rem var(--f-mono);flex:none}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;position:relative}
.scr-pad{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.navb{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-top:1px solid var(--line);padding:8px 18px 14px;background:var(--surface)}
.navb button{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--muted);gap:2px}
.navb button[aria-current="true"]{color:var(--ink);font-weight:700}
.navb .fab{width:56px;height:56px;border-radius:50%;background:var(--signal);color:var(--signal-ink);margin-top:-30px;box-shadow:var(--shadow);justify-content:center;font-weight:700}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hdr{display:flex;align-items:center;gap:8px;padding:6px 12px}
.hdr h2{font-size:1.05rem;flex:1;min-width:0}
.ib{background:none;border:0;width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:var(--sunk)}
.loc-chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;background:var(--tram-soft);color:var(--tram);padding:3px 10px;border-radius:99px;font-weight:700}
.loc-chip.off{background:var(--sunk);color:var(--muted)}
.fchips{display:flex;gap:6px;overflow-x:auto}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.82rem;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.map{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/10;max-width:100%;border:1px solid var(--line);flex:none}
.map svg{width:100%;height:100%;display:block}
.pin{position:absolute;transform:translate(-50%,-100%);background:none;border:0;padding:0}
.pin span{display:block;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--tram);border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.card{display:flex;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;width:100%}
.card:hover{border-color:var(--tram)}
.thumb{width:72px;height:72px;border-radius:10px;overflow:hidden;flex:none}
.thumb svg,.photo svg{width:100%;height:100%;display:block}
.ttl{font-weight:700;line-height:1.3}
.meta{font-size:.8rem;color:var(--muted)}
.counts{display:flex;gap:12px;font-size:.8rem;color:var(--muted)}
.counts span{display:inline-flex;align-items:center;gap:3px}
.counts svg.i{width:15px;height:15px}
.status{font:500 .66rem var(--f-mono);text-transform:uppercase;padding:2px 6px;border-radius:6px;white-space:nowrap;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.st-Open{background:var(--surface)}
.st-Acknowledged{background:var(--med-soft);color:var(--med);border-color:transparent}
.st-Inprogress{background:var(--high-soft);color:var(--high);border-color:transparent}
.st-Resolved{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.st-Forwarded{background:var(--tram-soft);color:var(--tram);border-color:transparent}
.photo{aspect-ratio:16/10;border-radius:14px;overflow:hidden;position:relative;max-width:100%;flex:none}
.photo .tag{position:absolute;left:8px;bottom:8px;background:rgba(20,33,44,.78);color:#fff;font:500 .68rem var(--f-mono);padding:3px 8px;border-radius:99px}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stepper div{font-size:.66rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.stepper i{height:4px;border-radius:2px;background:var(--line)}
.stepper .on i{background:var(--tram)}
.stepper .on{color:var(--ink)}
.office{background:var(--tram-soft);border-radius:12px;padding:10px 12px;font-size:.88rem}
.office b{display:block;font-size:.72rem;font-family:var(--f-mono);text-transform:uppercase;color:var(--tram);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.btn.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--tram)}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.metoo{display:flex;flex-direction:column;align-items:center;gap:4px}
.cmt{display:flex;gap:10px;font-size:.88rem}
.av{width:28px;height:28px;border-radius:50%;background:var(--sunk);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;flex:none}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.8rem;font-weight:700}
.inp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);width:100%}
textarea.inp{resize:vertical;min-height:70px}
.toggle{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.toggle input{width:20px;height:20px;accent-color:var(--crit);flex:none;margin-top:2px}
.ai-chip{display:flex;gap:10px;align-items:center;border:1px dashed var(--tram);background:var(--tram-soft);border-radius:12px;padding:10px 12px;font-size:.85rem}
.ai-chip b{color:var(--tram)}
.banner{border-radius:12px;padding:10px 12px;font-size:.85rem}
.banner.crit{background:var(--crit-soft);color:var(--crit);font-weight:700}
.banner.info{background:var(--med-soft);color:var(--ink)}
.sheet-bg{position:absolute;inset:0;background:rgba(10,18,24,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:18px 18px 22px;display:flex;flex-direction:column;gap:12px}
.toast{position:absolute;left:12px;right:12px;bottom:84px;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 14px;font-size:.85rem;z-index:6;display:flex;gap:8px;align-items:center}
.viewfinder{flex:1;background:#0b1116;position:relative;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.viewfinder .photo{border-radius:0;aspect-ratio:auto;flex:1}
.vf-top,.vf-bot{position:absolute;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.vf-top{top:0}.vf-bot{bottom:0;justify-content:center;flex-direction:column;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.shutter{width:68px;height:68px;border-radius:50%;border:5px solid #fff;background:var(--signal)}
.gps{background:rgba(0,0,0,.55);border-radius:99px;padding:4px 10px;font:500 .7rem var(--f-mono);display:inline-flex;gap:6px;align-items:center}
.gps i{width:8px;height:8px;border-radius:50%;background:#6fcb93;display:inline-block}
.gps.off i{background:#f07a6f}
.center-msg{padding:40px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.big-ok{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center}
.big-ok svg.i{width:32px;height:32px}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}

/* desktop frames */
.desk{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.chrome{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--sunk);border-bottom:1px solid var(--line)}
.chrome i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.url{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font:500 .75rem var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desk-scroll{overflow-x:auto}
.web{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;min-width:880px;height:600px}
.web>div{min-height:0;overflow-y:auto}

const T = id => TENANTS.find(t => t.id === id);
const kids = id => TENANTS.filter(t => t.parent === id);
const desc = id => [id, ...kids(id).flatMap(k => desc(k.id))];
const chain = id => { const out=[]; let t=T(id); while(t){ out.unshift(t); t=T(t.parent);} return out; };

const LEVELS = [['Critical',60],['High',25],['Medium',10],['Low',0]];
function breakdown(r){
  const likes = r.discount ? r.likes - r.discount : r.likes;
  const base = r.rep*5 + r.com*2 + likes;
  const decay = Math.pow(0.5, r.ageH/(24*14));
  const md = r.danger>=3 ? 1.5 : r.danger>=1 ? 1.2 : 1;
  const ms = r.safety ? 1.3 : 1;
  return {base, likes, decay, md, ms, score: base*decay*md*ms};
}
const score = r => breakdown(r).score;

  <section id="p-ten">
    <h2>Tenancy model</h2>
    <div class="prose"><p>Every report and every staff role belongs to a node in one tree. The levels follow German administration, and optional levels are skipped where they don't exist. Example nodes below; the full tree is imported from official boundary data. The pilot tenants are Neukölln and Spandau. The Bayern nodes only show how a Landkreis and its Gemeinden fit in; they are not live.</p></div>
    <div class="two">
      <div class="card-s"><h3>Example tree</h3><ul class="tree">${treeHTML('de')}</ul></div>
      <div class="card-s"><h3>Rules</h3><ul>
        <li><b>Node status.</b> Grouping (structure only), Not live, Pilot, Live. Only Pilot and Live nodes receive reports.</li>
        <li><b>Routing.</b> A report goes to the deepest Pilot or Live node containing the capture point. If none, the citizen sees "not live here yet" (US-44).</li>
        <li><b>Roles inherit down.</b> A Berlin viewer sees all Bezirke; a Neukölln case worker sees only Neukölln.</li>
        <li><b>Only the owner edits.</b> Higher levels read and roll up. They act only on reports forwarded to them.</li>
        <li><b>Responsibility is not geography.</b> A Landesstraße inside a Gemeinde belongs to the Land. Staff use <i>Forward</i> (US-45) to hand over, and the citizen sees where it went.</li>
        <li><b>Boundaries.</b> BKG VG250 polygons with AGS keys for Länder, Kreise and Gemeinden; Berlin's open-data Bezirk polygons for Berlin. Hamburg Bezirke follow the same pattern.</li>
        <li><b>IDs.</b> <span class="mono">BE-NK-2026-0118</span> = Land, tenant, year, sequence.</li>
      </ul></div>

  <section id="p-ai">
    <h2>Intelligent analysis</h2>
    <div class="prose"><p>Four parts, each with a guardrail. The deterministic score ranks the queue; the language model only explains and summarises, and every claim it makes links to reports.</p></div>
    <div class="two">
      <div class="card-s"><h3>1 · Priority score</h3><p class="small">Unique accounts only: co-reporter 5, commenter 2, Me too 1. Recency half-life 14 days. Danger ×1.5 or ×1.2, safety category ×1.3. Levels: Critical ≥ 60, High ≥ 25, Medium ≥ 10.</p><p class="small muted">Guardrail: transparent breakdown, manual override with reason, spike discount.</p></div>
      <div class="card-s"><h3>2 · Hotspots &amp; trends</h3><p class="small">Clusters within 150 m per category group. Weekly counts with change against the 4-week average. Recurring places get a weekday pattern.</p><p class="small muted">Guardrail: plain statistics, no model. Numbers shown with their counts.</p></div>
      <div class="card-s"><h3>3 · Weekly AI briefing</h3><p class="small">Every Monday 07:00 per tenant and per roll-up level, emailed automatically to tenant admins and shown in the console for everyone in scope. Input: top-scored reports, clusters, trend deltas and comment text in scope. Output: at most 5 items marked Urgent, Watch or Improving.</p><p class="small muted">Guardrail: structured output with mandatory report citations; any item without valid citations is dropped. Labelled AI-written; staff rate each item (US-54).</p></div>
      <div class="card-s"><h3>4 · Photo AI</h3><p class="small">On upload, at vlincta.com: face and plate blur, EXIF strip, category suggestion and photo similarity for duplicate matching.</p><p class="small muted">Guardrail: blur runs before anything is public; category is pre-selected only above 0.80 confidence; citizens' corrections are logged.</p></div>
    </div>

function trendFor(scope){

}

    const rows = ids.filter(id=>T(id).status==='live'||T(id).status==='pilot');
    const tr = id => Object.values(trendFor(id)).reduce((s,a)=>s+a[7],0);
    return `<h2>Hotspots · ${esc(T(D.scope).name)}</h2><p class="small muted">At roll-up levels hotspots are compared by tenant. Open a tenant to see its map.</p>
     <div class="tbl-wrap"><table><thead><tr><th>Tenant</th><th class="num">Open</th><th class="num">Critical</th><th class="num">New KW45</th><th>Top hotspot</th><th></th></tr></thead><tbody>
     ${rows.map(id=>{const rs=REPORTS.filter(r=>r.t===id),h=(HOTSPOTS[id]||[])[0];return `<tr><td><b>${esc(T(id).name)}</b><div class="meta">${esc(T(id).type)}</div></td><td class="num mono">${rs.filter(r=>r.status!=='Resolved').length}</td><td class="num mono">${rs.filter(r=>level(r)==='Critical').length}</td><td class="num mono">${tr(id)}</td><td class="small">${h?`${esc(h.name)} · ${esc(h.cat)}`:'—'}</td><td><button class="btn sm" data-act="scope:${id}">Open</button></td></tr>`}).join('')}
     </tbody></table></div>`;
  }
  const hs = HOTSPOTS[D.scope]||[], sel = hs.find(h=>h.id===D.hs)||hs[0];
  return `<h2>Hotspots · ${esc(T(D.scope).name)}</h2>
   <div class="hs"><div class="map" style="aspect-ratio:16/10">${streetMap()}${hs.map(h=>{const sz=22+h.n*4;return `<button class="cluster cl-${h.lv}" style="left:${h.x}%;top:${h.y}%;width:${sz}px;height:${sz}px" data-act="hs:${h.id}" aria-pressed="${sel&&sel.id===h.id}" aria-label="${esc(h.name)}, ${h.n} reports">${h.n}</button>`}).join('')}</div>
   <div class="col g8">${sel?`<div class="panel"><span class="lv lv-${sel.lv}" style="align-self:flex-start">${sel.lv}</span><h3>${esc(sel.name)}</h3><span class="small muted">${esc(sel.cat)} · ${sel.n} report${sel.n>1?'s':''}</span><p class="small">${esc(sel.rec)}</p><div>${sel.ids.map(id=>`<button class="cite" data-act="cite:${id}">${id}</button>`).join('')}</div></div>`:'<div class="panel small muted">No hotspots.</div>'}
    <div class="row wrap small muted"><span class="lv lv-Critical">Critical</span><span class="lv lv-High">High</span><span class="lv lv-Medium">Medium</span><span>Size = reports in cluster</span></div></div></div>`;
}
function barChart(name, vals, max){
  const W=300,H=120,pl=22,pb=18,pt=14,bw=(W-pl-8)/vals.length;
  const y=v=>H-pb-(v/max)*(H-pb-pt);
  const ticks=[0,Math.round(max/2),max];
  const last=vals[vals.length-1], avg=(vals[3]+vals[4]+vals[5]+vals[6])/4, ch=avg?Math.round((last-avg)/avg*100):0;
  return `<div class="chart"><div class="row"><b class="grow small">${esc(name)}</b><span class="mono small" style="color:${ch>25?'var(--crit)':ch<-25?'var(--ok)':'var(--muted)'}">${ch>=0?'+':''}${ch} %</span></div>
   <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(name)}: ${vals.join(', ')} reports per week">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--line);stroke-width:1"/><text x="${pl-4}" y="${y(t)+3}" text-anchor="end">${t}</text>`).join('')}
    ${vals.map((v,i)=>`<rect x="${pl+i*bw+3}" y="${y(v)}" width="${bw-6}" height="${H-pb-y(v)}" rx="2" style="fill:${i===vals.length-1?'var(--tram)':'var(--tram-soft)'}"/>`).join('')}
    <text class="lbl-end" x="${pl+(vals.length-1)*bw+bw/2}" y="${y(last)-4}" text-anchor="middle">${last}</text>
    ${WEEKS.map((w,i)=>i%2===1?`<text x="${pl+i*bw+bw/2}" y="${H-4}" text-anchor="middle">${w}</text>`:'').join('')}
   </svg><span class="small muted">KW45 vs 4-week average of ${avg.toFixed(1)}</span></div>`;
}
function admTrends(){
  const tr = trendFor(D.scope), max = Math.max(4, ...Object.values(tr).flat());
  const m = Math.ceil(max/4)*4;
  return `<div class="row wrap"><h2 class="grow">Trends · ${esc(T(D.scope).name)}</h2><button class="btn sm" data-act="export">Export CSV</button></div>
   ${kpis()}<p class="small muted">Reports per week, KW38–45. Same scale on every chart so categories can be compared.</p>
   <div class="sm-grid">${Object.entries(tr).map(([k,v])=>barChart(k,v,m)).join('')}</div>`;
}
function admFlagged(){
  const fl = inScope().filter(r=>r.flag);
  return `<h2>Flagged · ${esc(T(D.scope).name)}</h2>
   <p class="small muted">Spike rule: more than 10 votes in 60 minutes, more than half from accounts younger than 7 days. Without a residency check this is the main defence against manipulation.</p>
   ${fl.map(r=>`<div class="panel"><div class="row"><b class="grow">Unusual voting on "${esc(r.title)}"</b>${r.discount?'<span class="chip c-live">Resolved</span>':''}</div><span class="small">${esc(r.flag)}</span>
     ${r.discount?`<span class="small muted">${r.discount} votes discounted. Score now ${score(r).toFixed(1)} (${level(r)}).</span>`:`<div class="row wrap"><button class="btn sm primary" data-act="discount:${r.id}" ${canEdit(r)?'':'disabled'}>Count new accounts at half weight</button><button class="btn sm" data-act="cite:${r.id}">Open report</button></div>`}</div>`).join('')||''}
   ${D.scope==='nk'||D.scope==='be'||D.scope==='bec'?`<div class="panel"><b>Comment flagged by 2 citizens</b><span class="small">On "Swing seat broken at playground" · offensive-language filter</span><div class="row"><button class="btn sm" ${ROLES[D.role].edit?'':'disabled'} data-act="toast:Comment hidden from citizens">Hide comment</button><button class="btn sm" ${ROLES[D.role].edit?'':'disabled'} data-act="toast:Comment restored">Keep</button></div></div>`:''}
   ${!fl.length && !(D.scope==='nk'||D.scope==='be'||D.scope==='bec')?'<p class="muted">Nothing needs review.</p>':''}`;
}
function admSettings(){
  const role = ROLES[D.role], root = role.scope==='de'?'de':role.scope;
  if(!desc(root).includes(D.tnode)) D.tnode = root;
  const t = T(D.tnode), [cls,lab] = STATUS_CHIP[t.status];
  const ed = role.settings;
  const staff = {nk:[['Case worker','4 people'],['Tenant admin','1 person']],sp:[['Case worker','3 people'],['Tenant admin','1 person']],be:[['Viewer','2 people (Senatsverwaltung)']],de:[['Platform admin','3 people']]}[t.id]||[];
  return `<h2>Tenants &amp; roles</h2>${ed?'':'<div class="callout small">Read-only for this role. Tenant admins change their own tenant; platform admins change the tree.</div>'}
   <div class="two"><div class="panel"><h3>Tree</h3><ul class="tree">${treeHTML(root,{clickable:true})}</ul></div>
   <div class="panel"><div class="row"><h3 class="grow">${esc(t.name)}</h3><span class="chip ${cls}">${lab}</span></div><span class="small muted">${esc(t.type)} · ${esc(t.key)}</span>
    <div class="field"><label for="ts">Status</label><select class="inp" id="ts" ${ed&&role.scope==='de'?'':'disabled'}>${Object.entries(STATUS_CHIP).map(([k,[,l]])=>`<option ${k===t.status?'selected':''}>${l}</option>`).join('')}</select></div>
    <span class="small muted">Boundary: ${t.type==='Bezirk'?'Berlin open data, Bezirksgrenzen':'BKG VG250'} · Office: ${esc(t.office||'—')}</span>
    <b class="small">Roles at this node</b>${staff.length?staff.map(([r,n])=>`<div class="list-row small" style="padding:6px 0"><span>${r}</span><span class="muted">${n}</span></div>`).join(''):'<span class="small muted">None. Access comes from a level above.</span>'}
    ${(t.status==='live'||t.status==='pilot')?`<b class="small">Categories routed here</b><span class="small">Traffic: traffic light, pothole, bike lane, street lighting, road sign · Community: illegal dumping, playground, public toilet, youth centre, waste bins</span>
    <b class="small">Score thresholds</b><span class="small mono">Critical ≥ 60 · High ≥ 25 · Medium ≥ 10</span>
    <b class="small">Forwarding contacts (email)</b><span class="small">${(EXTERNAL[chain(t.id)[1]?.id]||[]).map(esc).join(' · ')||'None yet'}</span><span class="small muted">Addresses still to be collected (Q-07).</span>
    <b class="small">Monday briefing email</b><span class="small">Mondays 07:00 to the tenant admins of this tenant</span>`:''}
    <button class="btn sm" ${ed?'':'disabled'} data-act="toast:Invitation sent">Invite staff</button></div></div>`;
}

/* =====================================================================
   ROUTER + EVENTS
   ===================================================================== */
const VIEWS = {plan:renderPlan, stories:renderStories, app:renderApp, web:renderWeb, admin:renderAdmin};
function view(){ const h = location.hash.slice(1); return VIEWS[h]?h:'plan'; }
function render(keepScroll){
  const v = view(), scr = document.getElementById('scr'), st = scr?scr.scrollTop:0;
  document.getElementById('page').innerHTML = VIEWS[v]();
  document.querySelectorAll('.tabs a').forEach(a=>a.setAttribute('aria-current', a.getAttribute('href')==='#'+v?'page':'false'));
  const ns = document.getElementById('scr'); if(ns && keepScroll) ns.scrollTop = st;
}
let toastTimer;
function toast(where,msg){ where.toast=msg; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{where.toast='';render(true);},2600); }
function needSign(verb, act){ if(A.signed) return false; A.sheet={step:'email'}; A.pending={verb,act}; return true; }
function go(screen){ A.screen=screen; A.toast=''; }

function act(a, el){
  const [k, ...rest] = a.split(':'); const v = rest.join(':');
  switch(k){
   case 'goto': { const [surf,id]=v.split(':'); if(surf==='app'){ A.sheet=null; if(id==='detail'&&!A.rid) A.rid=REPORTS[0].id; if(id==='posted'&&!A.newId){A.newId='BE-NK-2026-0118';} go(id);} else if(surf==='web'){ S.web.screen=id; } else { D.tab=id; } break; }
   case 'screen': A.sheet=null; go(v); break;
   case 'open': A.rid=v; if(v===A.newId && !R(v)) addNew(); go('detail'); break;
   case 'filter': A.filter=v; break;
   case 'vote': if(needSign('vote',a)) break; A.voted[v]=!A.voted[v]; if(A.voted[v]) A.follow[v]=true; toast(A, A.voted[v]?'Thanks. You now follow this report.':'Vote removed'); break;
   case 'follow': if(needSign('follow',a)) break; A.follow[v]=!A.follow[v]; break;
   case 'sheet-close': A.sheet=null; A.pending=null; if(A.screen==='signin') go('detail'); break;
   case 'sheet-code': A.sheet={step:'code'}; break;
   case 'sheet-done': { A.signed=true; A.sheet=null; const p=A.pending; A.pending=null; if(A.screen==='signin') go('detail');
     if(A._cmt){ const [id,val]=A._cmt; A._cmt=null; R(id).cmts.push(['Y',val,'now']); R(id).com++; A.follow[id]=true; toast(A,'Signed in. Comment posted.'); break; }
     if(p&&p.act) return act(p.act); break; }
   case 'signin-plain': A.sheet={step:'email'}; A.pending={verb:'continue'}; break;
   case 'signout': A.signed=false; A.voted={}; A.follow={}; break;
   case 'shoot': go(isLive(locTenant())?'compose':'notlive'); break;
   case 'ai-change': saveDraft(); A.draft.ai=false; break;
   case 'danger': saveDraft(); A.draft.danger=el.checked; break;
   case 'post': saveDraft(); go(A.loc==='nk'?'dup':'compose'); if(A.loc!=='nk') return act('different'); break;
   case 'join': if(needSign('add your photo',a)) break; R(v).rep++; A.voted[v]=true; A.follow[v]=true; A.rid=v; go('detail'); toast(A,'Your photo was added. You now follow this report.'); break;
   case 'different': if(needSign('post','different')) break; { const t=locTenant(); const code={nk:'BE-NK',sp:'BE-SP'}[t.id]; A.newId=`${code}-2026-0${A.seq++}`; addNew(); go('posted'); } break;
   case 'notify': A.notify[v]=!A.notify[v]; break;
   case 'web-open': S.web.rid=v; S.web.screen='web-browse'; break;
   case 'web-post': S.web.screen='web-post'; break;
   case 'web-close': S.web.screen='web-browse'; break;
   case 'tab': D.tab=v; break;
   case 'scope': D.scope=v; D.sel=null; D.hs=null; break;
   case 'sel': D.sel=v; break;
   case 'hs': D.hs=v; break;
   case 'tnode': D.tnode=v; break;
   case 'cite': { const r=R(v); if(!r){ D.tab='queue'; D.sel='BE-NK-2026-0109'; toast(D,`${v} is a probable duplicate of BE-NK-2026-0109. Merge it there.`); break;} D.tab='queue'; D.sel=v; if(!desc(D.scope).includes(r.t)) D.scope=r.t; break; }
   case 'fb': { const [i,lbl]=[v.split(':')[0], v.split(':').slice(1).join(':')]; D.fb[D.scope+i]=lbl; break; }
   case 'merge': { const r=R(v); r.rep+=1; r.merge=null; toast(D,'Merged. Duplicate reporter counted once.'); break; }
   case 'save': { const r=R(v), st=document.getElementById('q-status').value, note=document.getElementById('q-note').value, fwd=document.getElementById('q-fwd').value, ov=document.getElementById('q-ov').value, why=document.getElementById('q-why').value.trim();
     if(ov && !why){ document.getElementById('q-why').focus(); document.getElementById('q-why').placeholder='Add a reason to override the level'; return; }
     r.status = fwd?'Forwarded':st; r.note = fwd?`Forwarded to ${fwd}. ${note}`.trim():note; r.override = ov||null;
     const isExt = Object.values(EXTERNAL).flat().includes(fwd), n = r.rep+r.com+r.likes;
     toast(D, isExt ? `Forwarded by email to ${fwd}. ${n} followers notified.` : `Saved. ${n} followers notified.`); break; }
   case 'discount': { const r=R(v); r.discount=8; toast(D,'15 new-account votes now count at half weight.'); break; }
   case 'export': toast(D,'Export prepared: queue and trends, KW38–45'); break;
   case 'toast': toast(view()==='admin'?D:A, v); break;
  }
  render(true);
}
function saveDraft(){ const d=document.getElementById('desc'); if(d) A.draft.desc=d.value; }
function addNew(){
  if(R(A.newId)) return; const t=locTenant();
  REPORTS.push({id:A.newId,t:t.id,title:A.draft.desc?A.draft.desc.slice(0,40):'Pedestrian light not working',grp:'Traffic',sub:'Traffic light',loc:'Karl-Marx-Straße 83',ageH:0,status:'Open',rep:1,com:0,likes:0,danger:A.draft.danger?1:0,safety:true,x:48,y:46,scene:'light',dist:'0 m',ai:{cat:'Traffic light',conf:.94},note:'',desc:A.draft.desc||'No description.',cmts:[]});
  A.follow[A.newId]=true;
}

document.addEventListener('click', e=>{
  const go2 = e.target.closest('[data-goto]'); if(go2){ e.preventDefault(); document.getElementById(go2.dataset.goto)?.scrollIntoView({behavior:'smooth'}); return; }
  const op = e.target.closest('[data-open]'); if(op){ const [surf,id]=op.dataset.open.split(':'); if(surf==='app'){ if(id==='detail'&&!A.rid)A.rid=REPORTS[0].id; if(id==='posted'&&!A.newId)A.newId='BE-NK-2026-0118'; A.sheet=null; go(id);} else if(surf==='web') S.web.screen=id; else D.tab=id; return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  if(el.tagName==='INPUT' && el.type==='checkbox'){ act(el.dataset.act, el); return; }
  e.preventDefault(); act(el.dataset.act, el);
});
document.addEventListener('change', e=>{
  const c = e.target.dataset.change; if(!c) return;
  if(c==='loc'){ A.loc=e.target.value; A.sheet=null; go('home'); A.filter='All'; }
  if(c==='role'){ D.role=e.target.value; D.scope=ROLES[D.role].scope==='de'?'nk':ROLES[D.role].scope; D.sel=null; D.tnode=ROLES[D.role].scope; if(D.tab==='settings'&&!ROLES[D.role].settings){} }
  if(c==='scope' && e.target.value){ D.scope=e.target.value; D.sel=null; D.hs=null; }
  render(true);
});
document.addEventListener('submit', e=>{
  const f = e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const id = f.dataset.form.split(':')[1], val = document.getElementById('cmt-in').value.trim();
  if(!val) return;
  if(!A.signed){ A.sheet={step:'email'}; A.pending={verb:'comment',act:null}; A._cmt=[id,val]; render(true); return; }
  R(id).cmts.push(['Y',val,'now']); R(id).com++; A.follow[id]=true; toast(A,'Comment posted'); render(true);
});
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); });
render();
</script>
