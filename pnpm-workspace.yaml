packages:
  - "apps/*"
  - "packages/*"
# Packages allowed to run install scripts (native binaries).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Optional native or postinstall steps pulled in by Testcontainers (ssh2) and protobufjs; not needed.
  cpu-features: false
  protobufjs: false
  ssh2: false
# Security overrides for transitive dependencies whose parents still pin vulnerable ranges.
# Remove an entry once its parent ships a fixed range. (`pnpm audit --audit-level low` stays clean.)
overrides:
  # GHSA-67mh-4wv8-2f99: dev server CORS. drizzle-kit > @esbuild-kit/core-utils pins ~0.18.
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
  # GHSA-3g3m-2fjr-6pw4: AbortSignal bypass. testcontainers > archiver-utils (^10), jest (^13).
  'glob@>=9.0.0 <14.0.2': ^14.0.2
  # GHSA-g3hv-75wg-m249: ReDoS via globparts. Under the glob versions above and test-exclude.
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.20'
  - '@expo/config-plugins@58.0.13'
  - '@expo/config@58.0.12'
  - '@expo/env@2.6.0'
  - '@expo/fingerprint@0.21.10'
  - '@expo/image-utils@0.12.7'
  - '@expo/inline-modules@0.2.10'
  - '@expo/local-build-cache-provider@58.0.12'
  - '@expo/metro-config@58.0.22'
  - '@expo/metro-file-map@58.0.6'
  - '@expo/plist@0.10.2'
  - '@expo/prebuild-config@58.0.20'
  - '@expo/require-utils@58.0.6'
  - '@expo/router-server@58.0.22'
  - babel-preset-expo@58.0.25
  - expo-asset@58.0.21
  - expo-constants@58.0.16
  - expo-font@58.0.12
  - expo-keep-awake@58.0.4
  - expo-modules-autolinking@58.1.0
  - expo-modules-cli@0.5.0
  - expo-modules-core@58.1.0
  - expo-modules-jsi@58.0.23
  - expo-server@58.1.0
  - expo-status-bar@58.0.5
  - expo@58.0.24
  - expo-location@58.0.21
  - expo-notifications@58.1.9
  - expo-secure-store@58.0.3
# deepmerge has no fixed release for GHSA-gcqx-w48m-w2h4 (prototype poisoning via an own "__proto__"
# key). patches/deepmerge@4.3.1.patch fixes it in place and scripts/security-patches.test.mjs proves it,
# but `pnpm audit` matches on version only, so the advisory is listed here. Drop both when upstream ships a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
