# Local Supabase for development (ENG-22): `supabase start` (Supabase CLI 3, needs Docker).
# The hosted project gets the same settings with `npx supabase@3.1.0 config push --remote=ggjqqfotolfkpxigkydt`
# (overrides under [remotes.production] below). The email templates are refused there until the project has a
# custom SMTP sender (Supabase does not allow template changes on the free plan's built-in sender; E-13).
project_id = "kiezruf"

[api]
enabled = true
port = 54321
# Our tables are never served through the Data API: every query goes through the Kiezruf API (ENG-08).
schemas = ["graphql_public"]
extra_search_path = ["extensions"]
max_rows = 100

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

# Catches Supabase's own emails (sign-in codes) locally: http://127.0.0.1:54324
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/console"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# US-01: a 6-digit code, valid 10 minutes.
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Ihr Kiezruf-Code / Your Kiezruf code"
content_path = "./supabase/templates/code.html"

[auth.email.template.confirmation]
subject = "Ihr Kiezruf-Code / Your Kiezruf code"
content_path = "./supabase/templates/code.html"

# Staff need a second factor (ENG-17, ENG-22).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# The hosted project (ENG-22). `supabase config push --remote=ggjqqfotolfkpxigkydt` applies everything above to it,
# with these values in place of the local ones.
[remotes.production]
project_id = "ggjqqfotolfkpxigkydt"

[remotes.production.auth]
site_url = "https://kiezruf.vercel.app"
additional_redirect_urls = ["https://kiezruf.vercel.app/console"]
