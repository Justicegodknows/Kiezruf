# Local development services. Production runs in a German data centre (see plan, Architecture).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: kiezruf
      POSTGRES_PASSWORD: kiezruf
      POSTGRES_DB: kiezruf
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
  storage:   # S3-compatible photo storage (private originals, public blurred copies)
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kiezruf
      MINIO_ROOT_PASSWORD: kiezruf-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [storage:/data]
  mail:      # catches the Monday briefing and forwarding emails locally (UI on :8025)
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]
volumes:
  db:
  storage:
